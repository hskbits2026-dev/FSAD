spring.application.name=online-shopping

# --- HTTP server ---
# The port the backend listens on. Override with the SERVER_PORT env var; defaults to 8081.
server.port=${SERVER_PORT:8081}

# --- Error responses ---
# Never expose Java stack traces to clients (DevTools turns these on in dev; this keeps them off
# everywhere). Keep the human-readable message so the frontend can show something useful.
server.error.include-stacktrace=never
server.error.include-message=always

# --- MySQL (runtime) ---
spring.datasource.url=jdbc:mysql://localhost:3306/online_shopping?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-please-at-least-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Seeded admin ---
app.admin.email=${ADMIN_EMAIL:admin@shop.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# --- Stripe ---
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/checkout/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/checkout/cancel}

# --- Mail (Mailtrap HTTP Send API only; no SMTP) ---
app.mail.from=${MAIL_FROM:no-reply@shop.com}
app.mail.from-name=${MAIL_FROM_NAME:everystore}
mailtrap.api.base-url=${MAILTRAP_API_BASE_URL:https://sandbox.api.mailtrap.io}
mailtrap.api.inbox-id=${MAILTRAP_INBOX_ID:}
mailtrap.api.token=${MAILTRAP_API_TOKEN:}

# CORS (Phase-2 React dev origin)
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Low-stock alert threshold (single app-wide value; push fires when a paid decrement crosses to <= this)
app.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}
